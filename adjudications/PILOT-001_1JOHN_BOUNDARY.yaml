project_id: PILOT-001_1JOHN_NEXT_SERMON
passage: "1 John 2:28-3:3"
issue_id: ISSUE_1J_PERICOPE_AFTER_2_27
governing_judgment: "Use 1 John 2:28-3:3 as the sermon-sized unit for the sermon immediately following 1 John 2:18-27. This is a project segmentation, not a claim that 2:28-3:3 is the only defensible literary unit."
confidence: MODERATE
supporting_claim_ids:
  - YARB-1J-001
  - YARB-1J-002
  - PAIN-1J-001
  - PAIN-1J-002
  - KEAT-1J-001
  - KEAT-1J-002
  - HEIL-1J-002
live_alternatives:
  - "1 John 2:28-3:6"
  - "1 John 2:28-3:10"
  - "Separate 2:28-29 and 3:1-3"
reasons_for_project_choice:
  - "2:28 repeats the command to remain and therefore provides essential continuity with the preceding 2:18-27 sermon."
  - "2:29 introduces righteousness and divine begetting, which naturally opens into the children-of-God language of 3:1-2."
  - "3:1-2 develops the assurance movement from present identity to future likeness at Christ's appearing."
  - "3:3 gives the explicit present ethical entailment of that future hope and supplies a natural sermon landing."
  - "3:4 begins the sharper lawlessness/sin contrast that can govern the following sermon rather than overloading this one."
downstream_constraints:
  - "Do not treat 2:28 as detached from 2:27; the repeated 'remain in him' is the continuity hinge."
  - "Do not turn 2:29 into works-based assurance; righteousness is evidence/family likeness within the new-birth argument."
  - "Give 3:1-2 substantial weight as assurance and identity, not merely as setup for moral exhortation."
  - "Make 3:3 causally dependent on the hope of 3:2; purification is the present effect of eschatological hope."
  - "Do not import the full 3:4-10 sin debate into this sermon except as minimal forward horizon."
promotion_status: PROJECT_ONLY
