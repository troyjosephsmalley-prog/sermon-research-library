passage: "1 John 2:28-3:3"
issue_id: ISSUE_1J_2_28_PERICOPE_BOUNDARY
governing_judgment: "For the next sermon project after 1 John 2:18-27, use 1 John 2:28-3:3 as the provisional preaching unit. Treat this as a sermon segmentation within a larger disputed literary complex, not as a claim of universal paragraph consensus."
