reasons_for_project_choice:
  - "2:28 directly repeats the 2:27 command to remain in him, preserving continuity with the immediately preceding sermon while opening a new eschatological incentive."
  - "2:29 introduces righteousness and being begotten/born of God, which develops naturally into 3:1-2's children-of-God identity."
  - "3:2's future appearing/likeness leads directly to 3:3's present purification; 3:3 therefore gives the identity-and-hope sequence an explicit ethical result."
  - "3:4 begins the more difficult explicit sin/lawlessness contrast, providing a plausible next major turn for the following sermon."
  - "This segmentation preserves the important larger-unit alternatives rather than denying them."

downstream_constraints:
  - "The sermon must make 2:28's continuity with 2:27 audible; do not present 2:28 as an unrelated new topic."
  - "Do not make righteous practice the cause of becoming God's child; preserve the Father's love/new-birth gift as logically prior to the ethical consequence."
  - "Keep present identity, future likeness, and present purification causally related."
  - "Do not import the full 3:4-10 sinlessness debate into the sermon unless needed to prevent a material misconception."
  - "Research the pronoun/antecedent questions in 2:29-3:2 before architecture is frozen."
  - "Research the force of 3:3's purification language before final application is frozen."

promotion_status: PROJECT_ONLY
