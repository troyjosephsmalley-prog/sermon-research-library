issue_id: ISSUE_1J_2_28_PERICOPE_BOUNDARY
title: "Next sermon boundary after 1 John 2:18-27"
passage: "1 John 2:28-3:10"
question: "For the next sermon in sequence, what is the smallest textually responsible preaching unit beginning at 2:28 that preserves John's progression without overloading the sermon?"
status: PROJECT_ADJUDICATED

positions:
  - position_id: SERMON_UNIT_2_28_3_3
    summary: "Use 1 John 2:28-3:3 as the next sermon unit. This is a sermon segmentation rather than a claim that every commentary recognizes an independent formal literary paragraph at exactly these boundaries."
    supporting_claim_ids:
      - YARB-1J-001
      - YARB-1J-002
      - PAIN-1J-001
      - PAIN-1J-002
      - HEIL-1J-001
      - HEIL-1J-002
      - KEAT-1J-001
      - KEAT-1J-002
    disputing_claim_ids:
      - HEIL-1J-001
      - KEAT-1J-001
      - ODON-1J-001
    principal_difficulties:
      - "The exact boundary is not a consensus literary division."
      - "Heil's rhetorical structure continues through 3:6."
      - "Keating and O'Donnell retain larger 2:28-3:10 blocks."
    independence_groups:
      - YARBROUGH_2008
      - PAINTER_2002
      - HEIL_2015
      - KEATING_2017

  - position_id: LITERARY_UNIT_2_28_3_6
    summary: "Retain 2:28-3:6 as one rhetorical unit, preserving Heil's proposed opening/pivot/answer structure."
    supporting_claim_ids:
      - HEIL-1J-001
    disputing_claim_ids:
      - PAIN-1J-001
      - PAIN-1J-002
      - KEAT-1J-001
    principal_difficulties:
      - "The sin/lawlessness material in 3:4-6 introduces a second heavy exegetical burden."
      - "For a normal sermon duration, this may reduce the relative prominence of 3:1-3's assurance, identity, hope, and transformation."
    independence_groups:
      - HEIL_2015

  - position_id: LITERARY_UNIT_2_28_3_10
    summary: "Retain the larger children-of-God/righteousness block through 3:10."
    supporting_claim_ids:
      - KEAT-1J-001
      - ODON-1J-001
    disputing_claim_ids:
      - PAIN-1J-001
      - PAIN-1J-002
      - HEIL-1J-001
    principal_difficulties:
      - "This is a large unit for one sermon and includes the difficult sinlessness and children-of-the-devil material."
      - "O'Donnell's evidence is homiletical synthesis rather than independent technical corroboration."
    independence_groups:
      - KEATING_2017
      - ODONNELL_2017

  - position_id: SPLIT_2_28_29_THEN_3_1_3
    summary: "Follow Painter's formal subunits and separate 2:28-29 from 3:1-3."
    supporting_claim_ids:
      - PAIN-1J-001
      - PAIN-1J-002
    disputing_claim_ids:
      - HEIL-1J-001
      - KEAT-1J-002
    principal_difficulties:
      - "2:28-29 alone is unusually small for the established sermon-series duration."
      - "The parousia/new-birth language in 2:28-29 naturally develops into the child-of-God and future-likeness material in 3:1-3."
    independence_groups:
      - PAINTER_2002

unresolved_questions:
  - "Whether the antecedent of the relevant pronouns in 2:29 should be taken as the Son, the Father, or intentionally fluid."
  - "How strongly 3:3 functions as closure for a sermon unit versus the center/pivot of a larger 2:28-3:6 structure."
  - "Whether 3:4 should be treated as the next major turn or as the second half of a single rhetorical construction beginning at 2:28."
notes: "PILOT-001 preserves the difference between literary-unit claims and sermon-segmentation judgments."
