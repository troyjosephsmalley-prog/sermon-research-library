    contested: true
    independence_group: YARBROUGH_2008
    alternatives: ["2:28-3:3 as a sermon-sized unit", "2:28-3:6", "2:28-3:10"]
  - claim_id: YARB-1J-002
    passage: "1 John 3:1-3"
    issue: identity_hope_purity
    claim_type: literary_theological
    summary: "Within Yarbrough's 3:1-8 'Glory of Abiding' section, 3:1 focuses on the Father's love and present identity as God's children, while 3:2-3 moves from future transformation to present ethical urgency."
