claims:
  - claim_id: YARB-1J-001
    passage: "1 John 2:27-29"
    issue: pericope_boundary_and_abiding
    claim_type: literary_discourse
    summary: "Yarbrough treats 2:27-29 as the climactic 'Imperative to Abide' subsection within the larger 2:18-3:8 unit; 2:28 states the central pastoral command and introduces Christ's appearing, while 2:29 moves from the appearing to righteousness and new birth."
