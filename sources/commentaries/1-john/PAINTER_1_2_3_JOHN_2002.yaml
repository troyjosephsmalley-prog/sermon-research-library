claims:
  - claim_id: PAIN-1J-001
    passage: "1 John 2:28-29"
    issue: pericope_boundary_and_abiding
    claim_type: literary_structure
    summary: "Painter treats 2:28-29 as a distinct subunit in the ethical-test sequence, centred on acting righteously as the test of abiding."
    location: "pp. 212-216"
    quotation: null
    contribution: QUALIFIES
    confidence: HIGH
    contested: true
    independence_group: PAINTER_2002
    alternatives: ["Combine 2:28-29 with 3:1-3 for sermon segmentation"]
  - claim_id: PAIN-1J-002
    passage: "1 John 3:1-3"
    issue: identity_hope_purity
    claim_type: literary_theological
    summary: "Painter treats 3:1-3 as a distinct subunit on sanctification and sonship; his discussion explicitly connects 3:2's future revealing/appearing back to the parousia in 2:28, and 3:3 makes the hope of seeing and becoming like Christ ethically productive in present purification."
    location: "pp. 217-221, especially 219-221"
    quotation: null
    contribution: SUPPORTS
    confidence: HIGH
    contested: false
    independence_group: PAINTER_2002
    alternatives: []
  - claim_id: PAIN-1J-003
    passage: "1 John 2:29"
    issue: referents_in_2_29
    claim_type: syntax_discourse
    summary: "Painter argues that God is the referent in 2:29, especially because the 'begotten of him' formula elsewhere in 1 John refers to being begotten of God and the argument immediately continues with the Father and the children of God."
    location: "pp. 213-214"
    quotation: null
    contribution: DISPUTES
    confidence: HIGH
    contested: true
    independence_group: PAINTER_2002
    alternatives: ["Christ as first referent with God/Father as begetter in the second clause"]
  - claim_id: PAIN-1J-004
    passage: "1 John 3:1"
    issue: discourse_force_3_1
    claim_type: syntax_discourse
    summary: "Painter identifies 'See' as an imperative calling attention to something remarkable and argues that 'because of this' points forward to the following causal clause when followed by epexegetical hoti."
    location: "pp. 217-219"
    quotation: null
    contribution: SUPPORTS
    confidence: HIGH
    contested: false
    independence_group: PAINTER_2002
    alternatives: []
  - claim_id: PAIN-1J-005
    passage: "1 John 3:2"
    issue: future_likeness
    claim_type: eschatological_theological
    summary: "Painter emphasizes the already/not-yet tension: believers are God's children now, while what they will be is not yet revealed; the future appearing resumes the parousia language of 2:28."
    location: "pp. 218-220"
    quotation: null
    contribution: SUPPORTS
    confidence: HIGH
    contested: false
    independence_group: PAINTER_2002
    alternatives: []
  - claim_id: PAIN-1J-006
    passage: "1 John 3:3"
    issue: hope_and_purification
    claim_type: lexical_theological
    summary: "Painter notes ritual associations of the purity vocabulary and possible baptismal background but finds no positive indication that baptism itself is the point; the present tense supports an ongoing process of purification."
    location: "pp. 218-221"
    quotation: null
    contribution: QUALIFIES
    confidence: HIGH
    contested: false
    independence_group: PAINTER_2002
    alternatives: []
