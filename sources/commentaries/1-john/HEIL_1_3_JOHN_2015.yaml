claims:
  - claim_id: HEIL-1J-001
    passage: "1 John 2:28-3:6"
    issue: pericope_boundary_and_abiding
    claim_type: rhetorical_structure
    summary: "Heil treats 2:28-3:6 as a chiastic unit: 2:28-3:2 forms the first major element, 3:3 is the central purity pivot, and 3:4-6 answers the opening element with the sin/lawlessness contrast."
