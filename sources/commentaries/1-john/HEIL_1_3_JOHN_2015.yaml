    passage: "1 John 2:28"
    issue: continuity_with_previous_sermon
    claim_type: discourse_relation
    summary: "Heil identifies the repeated 'remain in him' language at 2:28 as a transition that directly links the new unit with the closing exhortation of 2:27."
