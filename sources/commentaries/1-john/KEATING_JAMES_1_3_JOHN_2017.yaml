claims:
  - claim_id: KEAT-1J-001
    passage: "1 John 2:28-3:10"
    issue: pericope_boundary_and_abiding
    claim_type: literary_structure
    summary: "Keating begins a new major movement at 2:28 and treats 2:28-3:10 as 'The Children of God', internally dividing it into 2:28-3:2, 3:3-6, and 3:7-10."
    location: "pp. 175-189, especially 177ff."
    quotation: null
    contribution: QUALIFIES
    confidence: HIGH
    contested: true
    independence_group: KEATING_2017
    alternatives: ["2:28-3:3 sermon segmentation", "2:28-3:6"]
  - claim_id: KEAT-1J-002
    passage: "1 John 2:28-29"
    issue: continuity_with_previous_sermon
    claim_type: discourse_relation
    summary: "Keating explicitly describes 2:28-29 as a hinge with good reasons for attachment both backward and forward, but places it with the following section because it introduces righteousness and new birth themes developed there."
    location: "pp. 177-179"
    quotation: null
    contribution: SUPPORTS
    confidence: HIGH
    contested: false
    independence_group: KEATING_2017
    alternatives: []
- claim_id: KEAT-1J-003
    passage: "1 John 2:29"
    issue: referents_in_2_29
    claim_type: syntax_discourse
    summary: "Keating notes that the masculine pronoun can grammatically refer to either Son or Father, but judges 'begotten by him' highly likely to refer to the Father because Johannine divine begetting language elsewhere refers to God."
    location: "pp. 178-179"
    quotation: null
    contribution: QUALIFIES
    confidence: HIGH
    contested: true
    independence_group: KEATING_2017
    alternatives: ["Christ as first referent", "God/Father as referent throughout"]
- claim_id: KEAT-1J-004
    passage: "1 John 3:1-2"
    issue: fathers_love_and_future_identity
    claim_type: theological_synthesis
    summary: "Keating treats 3:1-2 as a strong assurance of present child-of-God identity that opens onto a future likeness to Jesus at his coming, while acknowledging that the exact form of the future state exceeds present knowledge."
    location: "section 'God's Righteous Children (2:28-3:2)', pp. 177ff."
    quotation: null
    contribution: SUPPORTS
    confidence: HIGH
    contested: false
    independence_group: KEATING_2017
    alternatives: []
  - claim_id: KEAT-1J-005
    passage: "1 John 3:3"
    issue: hope_and_purification
    claim_type: causal_ethics
    summary: "Keating reads 3:3 as the present consequence of future hope: those who hope to become like the Lord pursue purity now; the wider letter explains purity in terms of avoiding sin, keeping the commands, and walking as Jesus walked."
    location: "section 'Purity and Sin Contrasted (3:3-6)'"
